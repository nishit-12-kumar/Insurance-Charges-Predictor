# =============================================================================
# Insurance Charges Predictor — Project Configuration
#
# Single source of truth for:
#   - data paths and split settings
#   - raw feature schema
#   - training configuration
#   - model hyperparameter search spaces
#   - saved artifacts
#
# Engineered features are added to the schema by DataIngestion at runtime.
# Do not add engineered columns manually to numeric_features or
# categorical_features.
# =============================================================================


# =============================================================================
# DATA
# =============================================================================
data:

  # Original source dataset.
  source_csv: data/raw/insurance_dataset.csv

  # Complete feature-engineered dataset created by DataIngestion.
  raw_csv: data/processed/raw_engineered.csv

  # Final modelling splits.
  train_csv: data/processed/train.csv
  val_csv: data/processed/val.csv
  test_csv: data/processed/test.csv

  # SQLite database used as the project's analytical data layer.
  sqlite_db: data/processed/insurance.db

  # Dataset split: 70% train / 15% validation / 15% test.
  val_size: 0.15
  test_size: 0.15

  # Reproducibility.
  random_state: 42



# =============================================================================
# SCHEMA
# =============================================================================
schema:

  # Original numerical features.
  numeric_features:
    - age
    - bmi
    - children

  # Original categorical features.
  categorical_features:
    - gender
    - smoker
    - region
    - medical_history
    - family_medical_history
    - exercise_frequency
    - occupation
    - coverage_level

  # Regression target.
  target: charges


# =============================================================================
# TRAINING
# =============================================================================
training:

  # Reproducibility and parallelism.
  random_state: 42
  n_jobs: -1

  # Cross-validation and hyperparameter search.
  cv_folds: 5
  n_iter: 15
  scoring: r2

  # XGBoost execution device.
  # auto  -> CUDA when available, otherwise CPU
  # cuda  -> force CUDA
  # cpu   -> force CPU
  xgboost_device: auto

  # XGBoost early stopping patience.
  xgb_early_stopping_rounds: 20


  # ---------------------------------------------------------------------------
  # MODEL CONFIGURATION
  # ---------------------------------------------------------------------------
  #
  # Every model's search space is defined here.
  # model_trainer.py should not contain fallback/default hyperparameter grids.
  # ---------------------------------------------------------------------------

  models:

    LinearRegression:
      enabled: true
      tune: false
      params: {}

    Ridge:
      enabled: true
      tune: true
      params:
        alpha:
          - 0.01
          - 0.1
          - 1.0
          - 10.0
          - 50.0
          - 100.0

    ElasticNet:
      enabled: true
      tune: true
      params:
        alpha:
          - 0.01
          - 0.1
          - 1.0
          - 10.0
        l1_ratio:
          - 0.1
          - 0.3
          - 0.5
          - 0.7
          - 0.9

    RandomForest:
      enabled: true
      tune: true
      params:
        n_estimators:
          - 200
          - 400
          - 600
        max_depth:
          - null
          - 6
          - 10
          - 16
        min_samples_leaf:
          - 1
          - 2
          - 4

    XGBoost:
      enabled: true
      tune: true
      params:
        n_estimators:
          - 300
          - 500
          - 800
        learning_rate:
          - 0.01
          - 0.03
          - 0.05
          - 0.1
        max_depth:
          - 3
          - 4
          - 5
          - 6
        subsample:
          - 0.7
          - 0.85
          - 1.0
        colsample_bytree:
          - 0.7
          - 0.85
          - 1.0


# =============================================================================
# ARTIFACTS
# =============================================================================
artifacts:

  # Fitted preprocessing pipeline.
  preprocessor: artifacts/preprocessor.pkl

  # Selected champion model.
  best_model: artifacts/best_model.pkl

  # Metadata for the selected model.
  model_metadata: artifacts/model_metadata.json

  # Validation/model comparison report.
  model_comparison: artifacts/model_comparison.csv

  # Final held-out test evaluation.
  evaluation_report: artifacts/evaluation_report.json

  # Multicollinearity report.
  vif_report: artifacts/vif_report.json

  # Diagnostic plots.
  plots_dir: artifacts/plots
